<article class='post-card{{post_pinned_class}}'>
    <a href='{{post_url}}' class='post-card-inner'>
        <h3 class='post-card-title'>{{post_title}}</h3>
        <p class='post-card-excerpt'>{{post_excerpt}}</p>
        <span class='post-card-meta'>{{post_pinned}}{{post_date}}</span>
    </a>
</article>
