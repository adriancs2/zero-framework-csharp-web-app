# /etc/nginx/sites-available/hearthcms
#
# nginx = Pillar 1: edge shield + static file server.
#   - serves the public asset folders straight from disk (sendfile)
#   - buffers slow clients, then forwards clean HTTP/1.1 over loopback
#   - the C# process (127.0.0.1:5080) only sees dynamic page/API requests
#
# For HTTPS add a "listen 443 ssl; http2 on;" server with your certificate
# (e.g. certbot --nginx) - X-Forwarded-Proto tells the app the request was
# secure, so it marks its cookies Secure.

upstream hearthcms {
    server 127.0.0.1:5080;
    keepalive 32;                        # the app supports HTTP/1.1 keep-alive
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /opt/hearthcms;                 # the content root (published app folder)
    client_max_body_size 50m;            # = app MaxBodyBytes / original IIS limit
    server_tokens off;

    # Never expose protected data, binaries or dotfiles from disk.
    location ~* ^/app_data(/|$)   { return 404; }
    location ~ /\.                { return 404; }

    # Public asset folders: served by nginx. try_files falls back to the app,
    # which resolves case differences (the CMS was written on Windows) and
    # returns the proper 404.
    location ~* ^/(css|js|assets|fonts|media|uploads)/ {
        try_files $uri @hearthcms;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    location = /favicon.ico {
        try_files $uri @hearthcms;
        access_log off;
    }

    location / {
        try_files /nonexistent @hearthcms;
    }

    location @hearthcms {
        proxy_pass http://hearthcms;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";                 # upstream keep-alive
        proxy_set_header Host              $http_host;         # keeps :port (cookie scoping)
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering on;      # whole upload buffered before it reaches the app
    }

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json application/xml image/svg+xml;
}
